# CiberBot PT — configuração
# Todos os textos e limites podem ser alterados aqui, sem mexer no código.

[geral]
titulo = "CiberBot PT — Resumo diário de cibersegurança"
fuso_horario = "Europe/Lisbon"
janela_horas = 36          # só entram itens publicados nas últimas X horas
max_itens = 25             # máximo de destaques por edição
max_por_fonte = 8          # máximo por fonte (cada fonte pode ter o seu "max_itens")
estado = "state/vistos.json"
ordem_seccoes = ["portugal", "exploradas", "criticas", "noticias"]
notas_publicas = false     # true: mostra no site e nas mensagens as notas técnicas (fontes em baixo, tradução)

[limites]                  # máximo de itens por secção
portugal = 6
exploradas = 8
criticas = 6
noticias = 10

[web]
ativo = true
pasta = "docs"             # o GitHub Pages serve esta pasta
url_publica = "https://alexandreteles7.github.io/ciberbot-pt-v2/"   # aparece nas mensagens ("Ver no site")

[traducao]
ativa = true
# Tradutores por ordem de preferência; se um falhar ou não estiver disponível, passa ao seguinte.
#   anthropic: API da Claude (só com o segredo ANTHROPIC_API_KEY)
#   github:    GitHub Models, grátis com o token automático do GitHub Actions (sem criar nada)
#   mymemory:  serviço público gratuito, sem chave (limite de ~5000 caracteres por dia)
fornecedores = ["anthropic", "github", "mymemory"]
modelo = "claude-haiku-5-5"          # Claude; pode ser substituído pela variável CIBERBOT_MODELO
modelo_github = "openai/gpt-4.1-mini"  # GitHub Models (ver https://github.com/marketplace?type=models)
lote = 8                      # itens por pedido (anthropic e github)
resumo_max_caracteres = 380
mymemory_max_caracteres = 4500        # orçamento diário do MyMemory (os itens mais relevantes primeiro)
mymemory_resumo_max_caracteres = 200

# --------------------------------------------------------------------------------------
# FONTES
#   tipo: "rss" (RSS ou Atom), "kev" (catálogo CISA), "nvd" (CVE críticos do NIST)
#         ou "ghsa" (GitHub Advisory Database)
#   idioma: "pt" (não traduz) ou "en" (traduz para PT-PT)
#   categoria: portugal | exploradas | criticas | noticias  (define a secção)
#   peso: importância base da fonte na ordenação
# Se uma fonte falhar, as outras continuam e a falha aparece nas notas da edição.
# --------------------------------------------------------------------------------------

[[fontes]]
nome = "CNCS — Alertas de Segurança"
tipo = "rss"
url = "https://www.cncs.gov.pt/docs/alertas-seguranca/feed-rss/index.xml"
idioma = "pt"
categoria = "portugal"
peso = 40

# Imprensa de tecnologia em português, filtrada por palavras de cibersegurança.
# (O blogue «Segurança Informática» foi retirado: a proteção anti-robôs do site bloqueia o bot.)
[[fontes]]
nome = "Pplware"
tipo = "rss"
url = "https://pplware.sapo.pt/feed/"
idioma = "pt"
categoria = "portugal"
peso = 20
max_itens = 3
palavras_obrigatorias = ["cibersegurança", "ciberataque", "ataque informático", "vulnerabilidade", "ransomware", "phishing", "malware", "hacker", "piratas informáticos", "fuga de dados", "burla", "cncs", "falha de segurança", "zero-day", "spyware", "segurança informática"]

[[fontes]]
nome = "SAPO Tek"
tipo = "rss"
url = "https://tek.sapo.pt/rss"
idioma = "pt"
categoria = "portugal"
peso = 20
max_itens = 3
palavras_obrigatorias = ["cibersegurança", "ciberataque", "ataque informático", "vulnerabilidade", "ransomware", "phishing", "malware", "hacker", "piratas informáticos", "fuga de dados", "burla", "cncs", "falha de segurança", "zero-day", "spyware", "segurança informática"]

[[fontes]]
nome = "CISA — Vulnerabilidades exploradas (KEV)"
tipo = "kev"
url = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
idioma = "en"
categoria = "exploradas"
peso = 60
max_itens = 8

# O NVD bloqueia muitas vezes pedidos sem chave (HTTP 403). Uma chave gratuita resolve:
# https://nvd.nist.gov/developers/request-an-api-key → segredo NVD_API_KEY.
[[fontes]]
nome = "NVD — CVE críticos"
tipo = "nvd"
url = "https://services.nvd.nist.gov/rest/json/cves/2.0"
idioma = "en"
categoria = "criticas"
peso = 30
max_itens = 6

# Base de dados de vulnerabilidades do GitHub (revistas, gravidade crítica). Pública e sem chave;
# no Actions usa o GITHUB_TOKEN automático para ter mais pedidos. Repete-se pouco com o NVD
# (o mesmo CVE só aparece uma vez).
[[fontes]]
nome = "GitHub Advisories — críticas"
tipo = "ghsa"
url = "https://api.github.com/advisories"
idioma = "en"
categoria = "criticas"
peso = 30
max_itens = 4

[[fontes]]
nome = "BleepingComputer"
tipo = "rss"
url = "https://www.bleepingcomputer.com/feed/"
idioma = "en"
categoria = "noticias"
peso = 25

[[fontes]]
nome = "The Hacker News"
tipo = "rss"
url = "https://feeds.feedburner.com/TheHackersNews"
idioma = "en"
categoria = "noticias"
peso = 25
max_itens = 5              # publica muito: limitado para não encher a secção sozinho

[[fontes]]
nome = "Krebs on Security"
tipo = "rss"
url = "https://krebsonsecurity.com/feed/"
idioma = "en"
categoria = "noticias"
peso = 25
max_itens = 3

